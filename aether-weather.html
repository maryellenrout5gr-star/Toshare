<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether · Skies &amp; Weather</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600;1,9..144,700&family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#34435e;
  --ink-soft:#6b7a96;
  --ink-faint:#93a0b8;
  --paper:#fdf3ec;
  --sky-top:#eaf4ff;
  --sky-bottom:#fdf3ec;
  --radius:30px;
  --shadow-soft:0 18px 40px -20px rgba(58,78,120,.45);
  --shadow-pop:0 30px 62px -22px rgba(58,78,120,.55);
  --ease:cubic-bezier(.2,.8,.3,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Quicksand','ZCOOL KuaiLe',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(1000px 560px at 82% -10%, rgba(255,226,186,.55) 0%, transparent 62%),
    radial-gradient(900px 520px at 6% 6%, rgba(176,222,255,.55) 0%, transparent 60%),
    radial-gradient(700px 420px at 50% 102%, rgba(255,235,214,.6) 0%, transparent 65%),
    linear-gradient(180deg,var(--sky-top) 0%, #f2f7ff 40%, var(--sky-bottom) 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- paper grain + vignette ---------- */
.grain{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.16;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='260' height='260' filter='url(%23n)'/></svg>");
  mix-blend-mode:multiply;
}
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(120,140,180,.16) 100%);
}

/* ---------- ambient drifting clouds ---------- */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient .drift{
  position:absolute;opacity:.5;
  animation:drift linear infinite;
  filter:drop-shadow(0 8px 18px rgba(120,150,200,.18));
}
@keyframes drift{
  from{transform:translateX(-30vw)}
  to{transform:translateX(128vw)}
}
.ambient .drift:nth-child(1){top:12%;animation-duration:74s}
.ambient .drift:nth-child(2){top:34%;animation-duration:96s;animation-delay:-38s}
.ambient .drift:nth-child(3){top:58%;animation-duration:86s;animation-delay:-20s}
.ambient .drift:nth-child(4){top:78%;animation-duration:110s;animation-delay:-64s}
.orb{
  position:fixed;border-radius:50%;filter:blur(46px);z-index:0;pointer-events:none;
  animation:orbFloat 18s ease-in-out infinite;
}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-22px) scale(1.08)}}

/* ---------- header ---------- */
header.site{position:relative;z-index:3;text-align:center;padding:58px 20px 4px}
.logo{
  font-family:'Fraunces',Georgia,serif;
  font-style:italic;
  font-weight:600;
  font-size:clamp(46px,7.4vw,78px);
  line-height:1;
  letter-spacing:-.5px;
  color:var(--ink);
  text-shadow:0 2px 0 rgba(255,255,255,.65), 0 18px 34px rgba(90,120,170,.22);
  animation:titleIn 1.1s var(--ease) both;
}
.logo .dot{color:#f0a55e;font-style:normal}
@keyframes titleIn{from{opacity:0;transform:translateY(22px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.sub{
  font-family:'Quicksand',sans-serif;
  font-size:12px;font-weight:600;letter-spacing:7px;
  text-transform:uppercase;color:var(--ink-soft);
  margin-top:14px;animation:titleIn 1.1s .18s var(--ease) both;
}
.rule{
  width:120px;height:2px;margin:16px auto 0;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(120,150,200,.45),transparent);
  animation:titleIn 1.1s .3s var(--ease) both;
}

/* ---------- search ---------- */
.searchzone{position:relative;z-index:20;display:flex;flex-direction:column;align-items:center;gap:10px;margin:30px auto 4px;padding:0 18px}
.searchbox{position:relative;width:min(540px,100%)}
.searchbox input{
  width:100%;border:none;outline:none;
  font-family:'Quicksand','ZCOOL KuaiLe',sans-serif;
  font-size:16.5px;font-weight:500;color:var(--ink);
  padding:17px 52px 17px 24px;border-radius:999px;
  background:rgba(255,255,255,.8);
  box-shadow:var(--shadow-soft), inset 0 0 0 2px rgba(255,255,255,.7);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .28s var(--ease), box-shadow .28s var(--ease);
}
.searchbox input::placeholder{color:var(--ink-faint);font-weight:500}
.searchbox input:focus{
  transform:translateY(-3px);
  box-shadow:var(--shadow-pop), inset 0 0 0 2px rgba(240,165,94,.75);
}
.searchbox .ico{
  position:absolute;right:19px;top:50%;transform:translateY(-50%);
  font-size:18px;pointer-events:none;opacity:.55;
}
.suggest{
  position:absolute;top:calc(100% + 12px);left:0;right:0;z-index:40;
  background:rgba(255,255,255,.94);border-radius:22px;
  box-shadow:var(--shadow-pop);overflow:hidden;display:none;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.8);
}
.suggest.show{display:block;animation:popIn .22s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.suggest .row{
  padding:12px 22px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  gap:12px;font-size:15px;font-weight:600;transition:background .15s, padding-left .15s;
}
.suggest .row:hover,.suggest .row.active{background:linear-gradient(90deg,#fff3e2,#ffecf2);padding-left:26px}
.suggest .row .nm{font-family:'ZCOOL KuaiLe',cursive;font-size:16px}
.suggest .row .en{color:var(--ink-faint);font-size:12.5px;font-weight:600;letter-spacing:.6px}
.suggest .row .tp{font-size:12px;color:var(--ink-soft);font-weight:600}
.suggest .empty{padding:17px 22px;color:var(--ink-faint);font-size:14px;font-weight:500}
.hintbar{display:flex;align-items:center;gap:14px;z-index:20}
.hintbar .tip{font-size:12.5px;color:var(--ink-faint);font-weight:500;letter-spacing:.3px}
.hintbar .reset{
  border:none;background:none;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  padding:5px 13px;border-radius:999px;
  background:rgba(255,255,255,.55);box-shadow:0 4px 14px -6px rgba(80,105,150,.4);
  transition:.22s var(--ease);
}
.hintbar .reset:hover{background:#fff;color:var(--ink);transform:translateY(-2px)}

/* ---------- layout ---------- */
.wrap{position:relative;z-index:3;max-width:1180px;margin:0 auto;padding:26px 22px 74px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:26px}

/* ---------- card ---------- */
.card{
  position:relative;border-radius:var(--radius);overflow:hidden;
  min-height:312px;cursor:pointer;color:#fff;
  box-shadow:var(--shadow-soft);
  transition:transform .4s var(--ease), box-shadow .4s var(--ease);
  isolation:isolate;
  transform:translateZ(0);
}
.card.enter{animation:cardIn .72s var(--ease) both}
@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(.955)}
  to{opacity:1;transform:none}
}
.card:hover{transform:translateY(-9px) scale(1.017);box-shadow:var(--shadow-pop)}
.card:active{transform:translateY(-4px) scale(.998)}
.card.leaving{animation:cardOut .34s var(--ease) forwards;pointer-events:none}
@keyframes cardOut{to{opacity:0;transform:translateY(14px) scale(.9)}}

.card .scene{position:absolute;inset:0;z-index:0;overflow:hidden}
.card .content{
  position:relative;z-index:3;height:100%;
  padding:22px 24px 24px;display:flex;flex-direction:column;
  text-shadow:0 2px 12px rgba(28,38,68,.42);
}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .city{font-family:'ZCOOL KuaiLe',cursive;font-size:27px;line-height:1.05;letter-spacing:.5px}
.card .city .en{
  display:block;font-family:'Baloo 2',sans-serif;font-size:11.5px;font-weight:700;
  letter-spacing:2.6px;opacity:.86;margin-top:5px;text-shadow:0 1px 6px rgba(28,38,68,.4);
}
.card .del{
  flex:none;width:31px;height:31px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.26);color:#fff;font-size:14px;line-height:1;
  display:grid;place-items:center;
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);
  opacity:0;transform:scale(.55) rotate(-25deg);
  transition:opacity .26s var(--ease), transform .3s var(--ease), background .2s;
}
.card:hover .del,.card:focus-within .del{opacity:1;transform:scale(1) rotate(0)}
.card .del:hover{background:rgba(255,96,96,.88);transform:scale(1.12)}
.card .spacer{flex:1}
.card .temp{
  font-family:'Baloo 2',sans-serif;font-size:60px;font-weight:800;line-height:.95;
  letter-spacing:-1px;text-shadow:0 3px 16px rgba(28,38,68,.35);
}
.card .temp sup{font-size:24px;font-weight:600;vertical-align:super;opacity:.85;letter-spacing:0}
.card .desc{font-size:16.5px;font-weight:700;margin-top:4px}
.card .desc .en{font-size:11.5px;opacity:.85;font-family:'Baloo 2',sans-serif;font-weight:600;letter-spacing:1.4px}
.card .range{font-size:13px;opacity:.92;margin-top:7px;font-weight:600;letter-spacing:.4px}
.card .meta{
  display:flex;gap:20px;margin-top:15px;padding-top:13px;
  border-top:1px solid rgba(255,255,255,.28);
  font-size:14px;font-weight:700;
}
.card .meta div span{
  display:block;font-size:10.5px;font-weight:600;opacity:.82;
  letter-spacing:1.1px;margin-top:2px;text-transform:uppercase;font-family:'Quicksand',sans-serif;
}

/* add card */
.card.add{
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;
  color:var(--ink-soft);background:rgba(255,255,255,.42);
  border:2px dashed rgba(150,165,200,.6);
  box-shadow:none;text-shadow:none;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  min-height:312px;
}
.card.add:hover{background:rgba(255,255,255,.72);border-color:rgba(240,165,94,.75);color:var(--ink)}
.card.add .plus{
  font-size:44px;line-height:1;margin-bottom:6px;font-weight:400;
  transition:transform .4s var(--ease);
}
.card.add:hover .plus{transform:rotate(90deg) scale(1.1)}
.card.add .t{font-family:'ZCOOL KuaiLe',cursive;font-size:17px}
.card.add .e{font-size:11.5px;opacity:.72;font-weight:600;letter-spacing:1.6px}

/* ---------- footer ---------- */
footer{
  position:relative;z-index:3;text-align:center;color:var(--ink-faint);
  font-size:12.5px;font-weight:500;letter-spacing:1.2px;padding:0 20px 40px;
}
footer .heart{color:#ef9a9a}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:34px;
  transform:translate(-50%,90px) scale(.94);
  background:rgba(52,67,94,.96);color:#fff;
  padding:13px 28px;border-radius:999px;
  font-size:14px;font-weight:600;letter-spacing:.4px;
  z-index:99;opacity:0;pointer-events:none;
  transition:transform .42s var(--ease), opacity .32s ease;
  box-shadow:var(--shadow-pop);backdrop-filter:blur(8px);
}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* =============== WEATHER SCENES =============== */
.sky-clear {background:linear-gradient(165deg,#3fa9f0 0%,#7fcdf7 42%,#bfe4fb 72%,#ffe9b6 100%)}
.sky-cloudy{background:linear-gradient(165deg,#7e97b8 0%,#a3b5cd 45%,#c6d3e2 74%,#e3e9f1 100%)}
.sky-rain  {background:linear-gradient(165deg,#4c5c78 0%,#66788f 42%,#8593a8 74%,#a8b3c4 100%)}
.sky-snow  {background:linear-gradient(165deg,#7c9fc6 0%,#a9c4de 42%,#d3e3f2 74%,#f0f6fc 100%)}
.sky-storm {background:linear-gradient(165deg,#232a45 0%,#333c60 40%,#4b5478 72%,#6b7092 100%)}
.sky-fog   {background:linear-gradient(165deg,#8f9aa9 0%,#aeb6c1 40%,#cdd2d9 72%,#e6e9ed 100%)}
.sky-night {background:linear-gradient(165deg,#141c40 0%,#26264f 40%,#413a6b 72%,#6a5686 100%)}

.sheen{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,20,44,.02) 30%,rgba(12,20,44,.34) 72%,rgba(12,20,44,.58) 100%)}
.scene.light-on .sheen{background:linear-gradient(180deg,rgba(12,20,44,.05) 24%,rgba(12,20,44,.42) 62%,rgba(12,20,44,.7) 100%)}

/* sun */
.sun{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#fffbe6 0%,#ffe07a 45%,#ffb545 100%);
  box-shadow:0 0 60px 16px rgba(255,208,92,.6), 0 0 130px 40px rgba(255,196,110,.28);
  animation:sunPulse 6s ease-in-out infinite;
}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.sunrays{position:absolute;width:0;height:0;animation:spin 34s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sunrays .ray{
  position:absolute;top:50%;left:50%;height:5px;
  margin:-2.5px 0 0 0;transform-origin:0 50%;
  background:linear-gradient(90deg,rgba(255,233,170,.75),rgba(255,233,170,0));
  border-radius:5px;
}
.gloworb{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,226,150,.5),rgba(255,226,150,0) 70%);
  animation:sunPulse 8s ease-in-out infinite;
}

/* clouds */
.cshape{display:block;overflow:visible}
.cloudgrp{
  position:absolute;
  animation:floatX linear infinite;
  will-change:transform;
}
@keyframes floatX{from{transform:translateX(-58%)}to{transform:translateX(150%)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(1.2deg)}}

/* rain */
.rainwrap{position:absolute;inset:-12%}
.drop{
  position:absolute;top:-8%;width:2px;border-radius:3px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.9));
  animation:fall linear infinite;
}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(520px)}}
.splash{
  position:absolute;bottom:6%;width:16px;height:5px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.5);
  animation:splashRipple 2.4s ease-out infinite;
}
@keyframes splashRipple{
  0%{transform:scale(.2);opacity:.85}
  70%{transform:scale(1.5);opacity:0}
  100%{transform:scale(1.5);opacity:0}
}

/* snow */
.flake{
  position:absolute;top:-8%;color:#fff;user-select:none;
  animation:snowfall linear infinite;text-shadow:0 0 8px rgba(255,255,255,.7);
}
@keyframes snowfall{
  from{transform:translateY(0) rotate(0deg) translateX(0)}
  to{transform:translateY(500px) rotate(360deg) translateX(26px)}
}

/* storm */
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flashSeq 7s infinite}
@keyframes flashSeq{
  0%,86%,100%{opacity:0}
  87%{opacity:.62} 88%{opacity:.06} 89.5%{opacity:.5} 91%{opacity:0}
}
.bolt{
  position:absolute;opacity:0;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 20px #9fd8ff);
  animation:zap 7s infinite;
}
@keyframes zap{
  0%,86%,100%{opacity:0;transform:scale(.9)}
  87%{opacity:1;transform:scale(1)}
  88%{opacity:.15}
  89.5%{opacity:1}
  91%,100%{opacity:0}
}

/* fog */
.fogband{
  position:absolute;left:-40%;width:180%;height:54px;border-radius:50%;
  background:rgba(255,255,255,.42);filter:blur(14px);
  animation:fogmove linear infinite;
}
@keyframes fogmove{from{transform:translateX(-14%)}to{transform:translateX(14%)}}
.fogveil{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(238,240,244,.34) 45%,rgba(255,255,255,.55) 100%);
  animation:veil 12s ease-in-out infinite;
}
@keyframes veil{0%,100%{opacity:.55}50%{opacity:.85}}

/* night */
.moon{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#ffffff 0%,#f2f4ff 42%,#d3d8f5 68%,#aeb4dd 100%);
  box-shadow:0 0 44px 12px rgba(205,215,255,.55), 0 0 120px 46px rgba(160,180,255,.22),
             inset -18px -12px 0 -6px rgba(120,130,185,.28);
  animation:moonBreathe 9s ease-in-out infinite;
}
@keyframes moonBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.moon .crater{position:absolute;border-radius:50%;background:rgba(140,150,200,.28);box-shadow:inset 1px 1px 2px rgba(90,100,150,.25)}
.star{
  position:absolute;border-radius:50%;background:#fff;
  animation:twinkle ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.2;transform:scale(.6)}
  50%{opacity:1;transform:scale(1.35)}
}
.shooting{
  position:absolute;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff);
  opacity:0;animation:shoot 9s ease-in infinite;
}
@keyframes shoot{
  0%,72%{opacity:0;transform:translate(0,0) rotate(22deg)}
  74%{opacity:1}
  80%{opacity:0;transform:translate(150px,62px) rotate(22deg)}
  100%{opacity:0;transform:translate(150px,62px) rotate(22deg)}
}
.milkyway{
  position:absolute;inset:0;
  background:radial-gradient(160px 70px at 70% 18%,rgba(180,190,255,.3),transparent 70%);
  filter:blur(10px);
}

/* ripple */
.ripple{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.12) 60%,transparent 70%);
  transform:scale(0);animation:rip .68s ease-out forwards;pointer-events:none;z-index:6;
}
@keyframes rip{to{transform:scale(4.2);opacity:0}}

/* ---------- responsive ---------- */
@media(max-width:560px){
  .grid{grid-template-columns:1fr;gap:20px}
  .wrap{padding:22px 16px 60px}
  header.site{padding:42px 18px 4px}
  .card .temp{font-size:52px}
  .card{min-height:296px}
  .ambient .drift:nth-child(4){display:none}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.01s !important}
}
</style>
</head>
<body>

<!-- hand-drawn SVG filter defs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="7" result="nz"/>
      <feDisplacementMap in="SourceGraphic" in2="nz" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="nz2"/>
      <feDisplacementMap in="SourceGraphic" in2="nz2" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="grain"></div>
<div class="vignette"></div>
<div class="orb" style="width:280px;height:280px;left:-90px;top:6%;background:rgba(255,214,150,.4)"></div>
<div class="orb" style="width:320px;height:320px;right:-110px;top:24%;background:rgba(160,205,255,.38);animation-delay:-6s"></div>

<div class="ambient" id="ambient"></div>

<header class="site">
  <div class="logo">Aether<span class="dot">.</span></div>
  <div class="sub">Skies &amp; Weather</div>
  <div class="rule"></div>
</header>

<div class="searchzone">
  <div class="searchbox">
    <input id="q" type="text" placeholder="搜索城市 · 试试「东京」或 Paris" autocomplete="off" spellcheck="false">
    <span class="ico">🔍</span>
    <div class="suggest" id="suggest"></div>
  </div>
  <div class="hintbar">
    <span class="tip">回车或点击加入</span>
    <button class="reset" id="reset">恢复默认</button>
  </div>
</div>

<div class="wrap">
  <div class="grid" id="grid"></div>
</div>

<footer>用 ☀️ 🌧️ ❄️ 手绘而成 · A hand-drawn weather garden <span class="heart">♥</span></footer>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Aether · Skies & Weather — 纯静态，无真实 API
   ========================================================= */

/* ---------- 天气类型定义 ---------- */
const WEATHER = {
  clear : {zh:"晴朗",   en:"Sunny",        sky:"sky-clear",  light:false},
  cloudy: {zh:"多云",   en:"Cloudy",       sky:"sky-cloudy", light:false},

/* ---------- 城市库（约 28 座） ---------- */
const CITIES = [

const DEFAULT = ["Beijing","Tokyo","New York","London","Harbin","Dubai"];

/* ---------- 工具 ---------- */
const rnd  = (a,b)=>a+Math.random()*(b-a);
const rndI = (a,b)=>Math.round(rnd(a,b));
const esc  = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 手绘云朵 SVG ---------- */
function cloudSVG(fill,op,width){
  const w = width || 150, h = Math.round(w*0.46);
  return `<svg class="cshape" width="${w}" height="${h}" viewBox="0 0 200 92" aria-hidden="true">
    <g fill="${fill}" opacity="${op}" filter="url(#rough)">
      <ellipse cx="56"  cy="60" rx="46" ry="25"/>
      <ellipse cx="96"  cy="46" rx="47" ry="34"/>
      <ellipse cx="142" cy="60" rx="41" ry="24"/>
      <rect x="22" y="58" width="152" height="22" rx="11"/>
    </g>
  </svg>`;
}

/* 云朵分区错相漂移：把上部区域切成 n 条水平带，每朵云独占一条，
   起始 X 分散、负延迟错开相位，避免堆叠。 */
function cloudGroup(n,opacity,tone){
  const bands = [];
  const top0 = 4, span = 56;
  const bandH = span / n;
  for(let i=0;i<n;i++){
    const bandTop = top0 + i*bandH;
    const top  = bandTop + rnd(0, bandH*0.42);
    const slot = (i + rnd(.12,.88)) / n;
    const scale = rnd(.5,.9);
    const dur   = rnd(38,66);
    const delay = -(dur * ((i + rnd(.15,.7)) / n));
    const op    = +(opacity * rnd(.72,1)).toFixed(2);
    const tint  = i % 2 === 0 ? "255,255,255" : "238,244,252";
    bands.push(
      `<div class="cloudgrp" style="top:${top.toFixed(1)}%;left:${(slot*100).toFixed(1)}%;
        opacity:${op};animation-duration:${dur.toFixed(1)}s;animation-delay:${delay.toFixed(1)}s">
        <div style="transform:scale(${scale.toFixed(2)});transform-origin:left top;
          animation:bob ${rnd(4.2,7.5).toFixed(1)}s ease-in-out ${(-rnd(0,4)).toFixed(1)}s infinite">
          ${cloudSVG(`rgba(${tint},1)`,1,rndI(120,168))}
        </div>
      </div>`
    );
  }
  return bands.join("");
}

function rainLayer(n,slant){
  let s = `<div class="rainwrap" style="transform:rotate(${slant}deg)">`;
  for(let i=0;i<n;i++){
    s += `<div class="drop" style="left:${rnd(-6,102).toFixed(1)}%;height:${rnd(13,24).toFixed(0)}px;
      animation-duration:${rnd(.55,1.15).toFixed(2)}s;animation-delay:${(-rnd(0,1.2)).toFixed(2)}s;
      opacity:${rnd(.42,.92).toFixed(2)};width:${rnd(1.4,2.4).toFixed(1)}px"></div>`;
  }
  s += `</div>`;
  for(let i=0;i<3;i++){
    s += `<div class="splash" style="left:${rnd(12,84).toFixed(0)}%;bottom:${rnd(4,9).toFixed(0)}%;
      animation-delay:${(-rnd(0,2.4)).toFixed(2)}s"></div>`;
  }
  return s;
}

function snowLayer(n){
  let s = "";
  for(let i=0;i<n;i++){
    s += `<div class="flake" style="left:${rnd(0,100).toFixed(1)}%;font-size:${rnd(9,19).toFixed(0)}px;
      animation-duration:${rnd(5,10).toFixed(1)}s;animation-delay:${(-rnd(0,9)).toFixed(1)}s;
      opacity:${rnd(.55,1).toFixed(2)}">❄</div>`;
  }
  return s;
}

function starLayer(n){
  let s = `<div class="milkyway"></div>`;
  for(let i=0;i<n;i++){
    const big = Math.random() < .18;
    const size = big ? rnd(3.5,5) : rnd(2,3.2);
    s += `<div class="star" style="left:${rnd(2,97).toFixed(1)}%;top:${rnd(3,72).toFixed(1)}%;
      width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;
      animation-duration:${rnd(1.6,4.4).toFixed(1)}s;animation-delay:${(-rnd(0,4)).toFixed(1)}s"></div>`;
  }
  s += `<div class="shooting" style="left:${rnd(10,50).toFixed(0)}%;top:${rnd(8,26).toFixed(0)}%;width:${rndI(70,120)}px;animation-delay:${(-rnd(0,9)).toFixed(1)}s"></div>`;
  return s;
}

/* ---------- 场景构建 ---------- */
function buildScene(w){
  const meta = WEATHER[w];
  let inner = "";

  if(w === "clear"){
    inner += `<div class="gloworb" style="width:280px;height:280px;top:-90px;right:-90px"></div>`;
    inner += `<div class="sunrays" style="top:52px;right:56px">
      ${Array.from({length:14},(_,i)=>
        `<div class="ray" style="width:${rnd(90,150).toFixed(0)}px;transform:rotate(${(i*360/14).toFixed(1)}deg);opacity:${rnd(.35,.75).toFixed(2)}"></div>`
      ).join("")}
    </div>`;
    inner += `<div class="sun" style="top:-26px;right:-22px;width:126px;height:126px"></div>`;
    inner += cloudGroup(2,.6);

  }else if(w === "cloudy"){
    inner += `<div class="sun" style="top:-14px;right:18px;width:80px;height:80px;opacity:.55;
      box-shadow:0 0 28px 8px rgba(255,214,120,.35)"></div>`;
    inner += cloudGroup(3,1);
    inner += cloudGroup(1,.45);

  }else if(w === "rain"){
    inner += cloudGroup(2,.95);
    inner += rainLayer(34,10);
    inner += rainLayer(14,14);

  }else if(w === "snow"){
    inner += cloudGroup(2,.85);
    inner += snowLayer(28);
    inner += `<div class="fogband" style="top:74%;height:70px;opacity:.5;animation-duration:16s"></div>`;

  }else if(w === "storm"){
    inner += cloudGroup(2,1);
    inner += cloudGroup(1,.6);
    inner += rainLayer(46,14);
    inner += `<svg class="bolt" width="70" height="120" viewBox="0 0 70 120"
        style="top:26%;left:56%;animation-delay:${(-rnd(0,7)).toFixed(1)}s">
        <path d="M40 4 L14 62 H34 L24 116 L58 50 H36 Z" fill="#fff8d6" stroke="#fff" stroke-width="2"/>
      </svg>`;
    inner += `<svg class="bolt" width="44" height="80" viewBox="0 0 70 120"
        style="top:38%;left:22%;animation-delay:${(-rnd(0,7)).toFixed(1)}s">
        <path d="M40 4 L14 62 H34 L24 116 L58 50 H36 Z" fill="#fff" stroke="#dff0ff" stroke-width="2"/>
      </svg>`;
    inner += `<div class="flash" style="animation-delay:${(-rnd(0,7)).toFixed(1)}s"></div>`;

  }else if(w === "fog"){
    inner += `<div class="sun" style="top:-10px;right:26px;width:74px;height:74px;opacity:.32;
      box-shadow:0 0 40px 16px rgba(255,230,180,.28)"></div>`;
    inner += cloudGroup(2,.42);
    inner += Array.from({length:6},(_,i)=>
      `<div class="fogband" style="top:${(16+i*14).toFixed(0)}%;height:${rndI(40,72)}px;
        opacity:${(.55-i*.055).toFixed(2)};animation-duration:${rndI(11,22)}s;
        animation-delay:${(-rnd(0,10)).toFixed(1)}s"></div>`
    ).join("");
    inner += `<div class="fogveil"></div>`;

  }else if(w === "night"){
    inner += `<div class="moon" style="top:-22px;right:-14px;width:98px;height:98px">
      <span class="crater" style="width:20px;height:20px;left:24px;top:30px"></span>
      <span class="crater" style="width:13px;height:13px;left:52px;top:56px"></span>
      <span class="crater" style="width:9px;height:9px;left:34px;top:66px"></span>
    </div>`;
    inner += starLayer(32);
    inner += cloudGroup(1,.22);
  }

  inner += `<div class="sheen"></div>`;
  return `<div class="scene ${meta.sky} ${meta.light ? "light-on" : ""}">${inner}</div>`;
}

/* ---------- 卡片 ---------- */
const grid = document.getElementById("grid");
let active = [];           // 当前展示的城市对象
const seen = new Set();    // 已入场过的城市（避免重绘时全部重新播动画）

function cardHTML(c, idx){
  const w  = WEATHER[c.w];
  const isNew = !seen.has(c.en);
  const delay = isNew ? Math.min(idx,8)*0.055 : 0;
  return `<div class="card ${isNew ? "enter" : ""}" data-city="${esc(c.en)}"
    style="animation-delay:${delay.toFixed(3)}s" tabindex="0">
    ${buildScene(c.w)}
    <div class="content">
      <div class="top">
        <div class="city">${esc(c.zh)}<span class="en">${esc(c.en).toUpperCase()}</span></div>
        <button class="del" title="移除 ${esc(c.zh)}" aria-label="移除">✕</button>
      </div>
      <div class="spacer"></div>
      <div class="temp">${c.t}<sup>°C</sup></div>
      <div class="desc">${w.zh}<span class="en"> / ${w.en}</span></div>
      <div class="range">↑ ${c.hi}° &nbsp; ↓ ${c.lo}°</div>
      <div class="meta">
        <div>${c.hum}%<span>湿度 Humidity</span></div>
        <div>${c.wind} km/h<span>风速 Wind</span></div>
      </div>
    </div>
  </div>`;
}

const ADD_CARD = `<div class="card add enter" id="addCard" tabindex="0">
  <div class="plus">＋</div>
  <div class="t">添加城市</div>
  <div class="e">ADD A CITY</div>
</div>`;

/* ---------- 数据驱动重绘 ---------- */
function render(){
  active.forEach(c=>seen.add(c.en));
  grid.innerHTML = active.map(cardHTML).join("") + ADD_CARD;

  grid.querySelectorAll(".card:not(.add) .del").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      removeCity(btn.closest(".card").dataset.city);
    });
  });

  grid.querySelectorAll(".card:not(.add)").forEach(card=>{
    card.addEventListener("click",e=>{
      ripple(card, e.clientX, e.clientY);
      const c = active.find(x=>x.en===card.dataset.city);
      if(c) toast(`${c.zh} · ${WEATHER[c.w].zh} ${c.t}°C`);
    });
    card.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){ e.preventDefault(); card.click(); }
    });
  });

  grid.querySelectorAll(".card .del").forEach(b=>{
    b.addEventListener("keydown",e=>e.stopPropagation());
  });

  const addCard = document.getElementById("addCard");
  if(addCard){
    addCard.addEventListener("click",()=>{
      const q = document.getElementById("q");
      q.focus();
      q.scrollIntoView({behavior:"smooth",block:"center"});
      openSuggest();
    });
    addCard.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){ e.preventDefault(); addCard.click(); }
    });
  }
}

function ripple(card,x,y){
  const r = document.createElement("span");
  const b = card.getBoundingClientRect();
  r.className = "ripple";
  r.style.width = r.style.height = "90px";
  r.style.left = (x - b.left - 45) + "px";
  r.style.top  = (y - b.top  - 45) + "px";
  card.appendChild(r);
  setTimeout(()=>r.remove(),700);
}

/* ---------- 增删 ---------- */
function addCity(en){
  const city = CITIES.find(c=>c.en.toLowerCase() === String(en).toLowerCase());
  if(!city){ toast("没有找到这座城市 · Not found"); return; }
  if(active.some(c=>c.en === city.en)){ toast(`${city.zh} 已经在列表中 · Already added`); return; }
  active.push(city);
  render();
  toast(`已加入 ${city.zh} · ${WEATHER[city.w].zh}`);
}

function removeCity(en){
  const city = active.find(c=>c.en === en);
  const el = grid.querySelector(`.card[data-city="${CSS.escape(en)}"]`);
  const done = ()=>{
    active = active.filter(c=>c.en !== en);
    render();
    toast(`已移除 ${city ? city.zh : ""} · Removed`);
  };
  if(el){ el.classList.add("leaving"); setTimeout(done,300); }
  else done();
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"),1900);
}

/* ---------- 搜索联想 ---------- */
const q = document.getElementById("q");
const sg = document.getElementById("suggest");
let suggList = [], suggIdx = -1;

function matchCities(term){
  const s = term.trim().toLowerCase();
  const shown = new Set(active.map(c=>c.en));
  const pool = CITIES.filter(c=>!shown.has(c.en));
  if(!s) return pool.slice(0,6);
  return pool.filter(c =>
    c.zh.includes(s) || c.en.toLowerCase().includes(s)
  ).slice(0,6);
}

function openSuggest(){
  const list = matchCities(q.value);
  suggList = list; suggIdx = -1;
  if(!list.length){
    sg.innerHTML = `<div class="empty">${
      q.value.trim() ? "没有匹配的城市 · No match" : "所有城市都已展示 · All cities shown"
    }</div>`;
    sg.classList.add("show");
    return;
  }
  sg.innerHTML = list.map((c,i)=>
    `<div class="row" data-i="${i}" data-en="${esc(c.en)}">
      <span class="nm">${esc(c.zh)}</span>
      <span class="tp">${WEATHER[c.w].zh} ${c.t}°C</span>
      <span class="en">${esc(c.en)}</span>
    </div>`
  ).join("");
  sg.classList.add("show");
  sg.querySelectorAll(".row").forEach(row=>{
    row.addEventListener("mousedown",e=>{
      e.preventDefault();
      pick(row.dataset.en);
    });
  });
}

function closeSuggest(){ sg.classList.remove("show"); suggIdx = -1; }

function pick(en){
  addCity(en);
  q.value = "";
  closeSuggest();
}

function highlight(i){
  const rows = sg.querySelectorAll(".row");
  rows.forEach(r=>r.classList.remove("active"));
  if(i >= 0 && i < rows.length){
    rows[i].classList.add("active");
    rows[i].scrollIntoView({block:"nearest"});
  }
}

q.addEventListener("input", openSuggest);
q.addEventListener("focus", openSuggest);
q.addEventListener("keydown", e=>{
  if(e.key === "ArrowDown"){
    e.preventDefault();
    if(!sg.classList.contains("show")) openSuggest();
    suggIdx = Math.min(suggIdx + 1, suggList.length - 1);
    highlight(suggIdx);
  }else if(e.key === "ArrowUp"){
    e.preventDefault();
    suggIdx = Math.max(suggIdx - 1, 0);
    highlight(suggIdx);
  }else if(e.key === "Enter"){
    e.preventDefault();
    const target = suggIdx >= 0 ? suggList[suggIdx] : suggList[0];
    if(target) pick(target.en);
    else if(q.value.trim()) toast("没有匹配的城市 · No match");
  }else if(e.key === "Escape"){
    closeSuggest(); q.blur();
  }
});
document.addEventListener("click", e=>{
  if(!e.target.closest(".searchbox")) closeSuggest();
});

document.getElementById("reset").addEventListener("click",()=>{
  active = DEFAULT.map(en=>CITIES.find(c=>c.en===en)).filter(Boolean);
  q.value = ""; closeSuggest(); render();
  toast("已恢复默认城市 · Reset");
});

/* ---------- 背景漂浮云 ---------- */
document.getElementById("ambient").innerHTML =
  Array.from({length:4},(_,i)=>{
    const w = rndI(120,190);
    return `<svg class="drift" width="${w}" height="${Math.round(w*0.46)}" viewBox="0 0 200 92" aria-hidden="true">
      <g fill="rgba(255,255,255,.85)" filter="url(#rough-soft)">
        <ellipse cx="56" cy="60" rx="46" ry="25"/>
        <ellipse cx="96" cy="46" rx="47" ry="34"/>
        <ellipse cx="142" cy="60" rx="41" ry="24"/>
        <rect x="22" y="58" width="152" height="22" rx="11"/>
      </g>
    </svg>`;
  }).join("");

/* ---------- init ---------- */
active = DEFAULT.map(en=>CITIES.find(c=>c.en===en)).filter(Boolean);
render();
</script>
